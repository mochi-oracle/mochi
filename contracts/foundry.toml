[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
# Reproducible bytecode: omit the metadata hash, which changes with comments, whitespace, source paths and remappings
# (e.g. ../node_modules) even when the compiled code is identical. The CBOR tail still records the solc version.
bytecode_hash = "none"
cbor_metadata = true
# poseidon-solidity's hash libraries are deployed separately (linked). Under via_ir they exceed EIP-170
# (29.3 / 32.9 KB); compiled like upstream (legacy pipeline, 10k runs) they are 23.6 / 12.6 KB.
additional_compiler_profiles = [{ name = "poseidon", via_ir = false, optimizer_runs = 10000 }]
compilation_restrictions = [{ paths = "**/poseidon-solidity/*.sol", via_ir = false, min_optimizer_runs = 10000 }]
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
allow_paths = ["../node_modules", "../vendor"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@mochi/=src/",
  "@oz/=lib/openzeppelin-contracts/contracts/",
  "@oz-upgradeable/=../node_modules/@openzeppelin/contracts-upgradeable/",
  "lean-imt/=../node_modules/@zk-kit/lean-imt.sol/",
  "poseidon/=../node_modules/poseidon-solidity/",
  "poseidon-solidity/=../node_modules/poseidon-solidity/",
]

[fuzz]
runs = 512

# Stateful invariants. The default keeps a local `forge test` to a few minutes; CI runs the deep profile:
#   FOUNDRY_PROFILE=deep forge test --match-path 'test/{invariant,registry,panel}/*Invariant*'
# Suites must not cap runs/depth inline (a `forge-config: default.invariant.*` comment), so these govern them.
[invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.deep.invariant]
runs = 1600
depth = 64
fail_on_revert = false
